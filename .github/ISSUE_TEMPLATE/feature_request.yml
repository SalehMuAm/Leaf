name: Feature request
description: Suggest an improvement to reading or editing.
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the reading or editing task and what makes it difficult today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested behavior
      description: How could this work while keeping Leaf's interface simple?
