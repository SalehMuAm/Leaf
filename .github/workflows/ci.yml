name: macOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Apple Silicon · macOS 15 · Xcode 16.4
    runs-on: macos-15
    timeout-minutes: 20
    env:
      # Pinned to an installed toolchain in the macos-15 arm64 runner image.
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify toolchain and architecture
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version

      - name: Test
        # PDFKit tests use AppKit windows; run serially in the macOS login session.
        run: swift test

      - name: Package ad hoc beta
        run: ./scripts/package-release.sh

      - name: Upload app archive and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Leaf-macos-arm64-beta
          path: |
            dist/Leaf-*-macos-arm64.zip
            dist/Leaf-*-macos-arm64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
